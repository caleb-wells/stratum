note: Generated by `python -m app.ingest.cli matrix` from the full text of each local code. Every quote
  was checked word for word against the source. Not reviewed by a licensed engineer.
cells:
  draper:
    fault_setback_method:
      specified: true
      value: The consultant shall use the fault setback calculation methodology for normal faults of Lund
        and others (2020), using S= U (2D + F/tan Ө) for the downthrown side and S= U x 2D for the upthrown
        side. The calculated setback is compared to the minimum in the Fault Setback Table for IBC Risk
        Categories, and the greater of the two is used.
      quote: A fault setback shall be calculated using the formulas presented herein and then compared
        to the minimum fault setback established in the Fault Setback Table for IBC Risk Categories.
      document: Draper City Geotechnical Engineering Standards
      file: draper-geotech-standards.pdf
      url: https://www.draperutah.gov/media/ysgcvslr/geotechnical-engineering-standards-with-append.pdf
      section: 'Appendix A: Minimum Standards for Fault Activity Investigations > 8.0 SURFACE-FAULTING
        MITIGATION > 8.1 Active Fault Mitigation by Fault Avoidance and Fault Setback'
      pages:
      - 34
      - 35
    fault_setback_minimum:
      specified: true
      value: 'The Fault Setback Table for IBC Risk Categories sets minimum setbacks and U factors by category:
        I: none (--); II(a) single-family dwellings: U 1.5, 15 feet; II(b): U 2, 20 feet; III: U 3, 50
        feet; IV: U 3, 50 feet. The minimums apply to both the downthrown and upthrown sides, and the
        greater of the minimum and calculated setback is used.'
      quote: '- IBC Risk Category2: III Buildings and other structures that represent a substantial hazard
        to human lives in the event of failure; Criticality3: 1; U4: 3; Minimum Setback (feet)4: 50'
      document: Draper City Geotechnical Engineering Standards
      file: draper-geotech-standards.pdf
      url: https://www.draperutah.gov/media/ysgcvslr/geotechnical-engineering-standards-with-append.pdf
      section: 'Appendix A: Minimum Standards for Fault Activity Investigations > 8.0 SURFACE-FAULTING
        MITIGATION > 8.1 Active Fault Mitigation by Fault Avoidance and Fault Setback > 8.1.3 Fault Setback
        Table for IBC Risk Categories'
      pages:
      - 36
      - 38
    active_fault_definition:
      specified: true
      value: For the WFZ, an active fault is one with displacement during the past 4,000 radiocarbon years
        before present (about 4,500 calibrated years before present). For other City faults not directly
        associated with the WFZ, the criterion is the past 10,000 14C yr. B.P. or about 11,700 cal yr.
        B.P. (Holocene).
      quote: The City defines an active fault as a fault displaying evidence of displacement along one
        or more of its traces during the past 4,000 radiocarbon years before present [14C yr. B.P.] or
        about 4,500 calibrated years before present [cal yr. B.P.] (about three times the closed mean
        recurrence interval between surface faulting earthquakes along the Salt Lake City and Provo segments
        of the Wasatch Fault Zone (WFZ)) (WGUEP, 2016).
      document: Draper City Geotechnical Engineering Standards
      file: draper-geotech-standards.pdf
      url: https://www.draperutah.gov/media/ysgcvslr/geotechnical-engineering-standards-with-append.pdf
      section: 'Appendix A: Minimum Standards for Fault Activity Investigations > 2.0 ACTIVE FAULT'
      pages:
      - 26
      - 26
    slope_fs_static:
      specified: true
      value: Static and surficial slope stability analyses require a minimum factor of safety of 1.5.
        If it is less than 1.5, mitigation is required, or the project must be designed, to achieve a
        minimum of 1.5.
      quote: '1. Static and surficial slope stability analyses: 1.5 (see Sections 8.0 Static Slope Stability
        Analysis and 9.0 Surficial Stability of Slopes).'
      document: Draper City Geotechnical Engineering Standards
      file: draper-geotech-standards.pdf
      url: https://www.draperutah.gov/media/ysgcvslr/geotechnical-engineering-standards-with-append.pdf
      section: 'Appendix B: Minimum Standards for Slope Stability Analyses > 4.0 FACTORS OF SAFETY'
      pages:
      - 52
      - 53
    slope_fs_seismic:
      specified: true
      value: Calibrated pseudostatic slope stability analyses require a minimum factor of safety of 1.0.
        If it is less than 1.0, a deformation analysis must be performed to estimate slope movement during
        an earthquake, with calculated displacements of 5 cm or less or mitigation to constrain them to
        5 cm or less.
      quote: '2. Calibrated pseudostatic slope stability analyses: 1.0 (see Section 10.0, Seismic Stability
        of Slopes).'
      document: Draper City Geotechnical Engineering Standards
      file: draper-geotech-standards.pdf
      url: https://www.draperutah.gov/media/ysgcvslr/geotechnical-engineering-standards-with-append.pdf
      section: 'Appendix B: Minimum Standards for Slope Stability Analyses > 4.0 FACTORS OF SAFETY'
      pages:
      - 52
      - 53
    slope_fs_temporary:
      specified: true
      value: Temporary excavations and slopes require a minimum factor of safety of 1.3, and mitigation
        measures must be recommended as necessary to maintain it during construction.
      quote: '3. Temporary excavations and slopes: 1.3.'
      document: Draper City Geotechnical Engineering Standards
      file: draper-geotech-standards.pdf
      url: https://www.draperutah.gov/media/ysgcvslr/geotechnical-engineering-standards-with-append.pdf
      section: 'Appendix B: Minimum Standards for Slope Stability Analyses > 4.0 FACTORS OF SAFETY'
      pages:
      - 52
      - 53
    seismic_coefficient:
      specified: true
      value: Pseudostatic analyses should use a seismic coefficient (kh) equal to ½ the PGAM. PGAM is
        the modified peak acceleration with a 2 percent probability of exceedance in 50 years (2,500-year
        return period).
      quote: Pseudostatic seismic slope stability analyses should be performed using a seismic coefficient
        (kh) equal to ½ the PGAM (see Section 10.1).
      document: Draper City Geotechnical Engineering Standards
      file: draper-geotech-standards.pdf
      url: https://www.draperutah.gov/media/ysgcvslr/geotechnical-engineering-standards-with-append.pdf
      section: 'Appendix B: Minimum Standards for Slope Stability Analyses > 10.0 SEISMIC SLOPE STABILITY
        ANALYSIS > 10.2 Seismic (Pseudostatic) Slope Stability Evaluations'
      pages:
      - 64
      - 65
    report_validity:
      specified: true
      value: Geotechnical reports are valid and applicable in the City for two years. After two years,
        the applicant shall submit a letter from the geotechnical engineer stating that the project scope
        is unchanged, the consultant's registration has not expired, site conditions have not changed,
        and the report meets City standards and the current Municipal Code.
      quote: Geotechnical reports shall be valid and applicable in the City for two years.
      document: Draper City Geotechnical Engineering Standards
      file: draper-geotech-standards.pdf
      url: https://www.draperutah.gov/media/ysgcvslr/geotechnical-engineering-standards-with-append.pdf
      section: 11.0 AMENDED AND UPDATED GEOTECHNICAL ENGINEERING STUDY REPORTS
      pages:
      - 15
      - 16
  fruit_heights:
    fault_setback_method:
      specified: true
      value: The city has adopted the fault setback calculation methodology for normal faults of Batatian
        and Nelson (1999) and Christenson and others (2003). For the hanging wall the setback is S= U
        (2D + F/tanӨ), and for the footwall it is S= U x 2D. The calculated setback is compared to the
        minimum setback in Table A-1, and the greater of the two is used. Top of slope and/or toe of slope
        setbacks required by the Building Code must also be considered, again using the greater. If another
        method is used, the consultant must justify it in the report.
      quote: To address wide discrepancies in fault setback recommendations, the city has adopted the
        fault setback calculation methodology for normal faults of Batatian and Nelson (1999) and Christenson
        and others (2003).
      document: 'Fruit Heights City SLEDS (Chapter 10.10A) Appendices: Minimum Standards for Hazard Studies'
      file: fruit-heights-sleds-app-b.pdf
      url: https://www.fruitheights.gov/DocumentCenter/View/1591
      section: Appendix B - Surface Fault Rupture > 2.0 MINIMUM STANDARDS FOR FAULT STUDIES > 2.4 Recommendations
        for fault setbacks
      pages:
      - 6
      - 7
    fault_setback_minimum:
      specified: true
      value: 'Table A-1 sets minimum setbacks by IBC class: A 25 feet (U 2.0); B, F, M and R (R-1, R-2,
        R-4) 20 feet (U 2.0); E, H and I 50 feet (U 3.0); R-3 including single family homes 15 feet (U
        1.5); S and U 0 (U 1). Minimum setbacks apply to both the hanging wall and footwall blocks. The
        chapter also provides that no habitable structure, essential facility or critical facility may
        be located over a fault, and that the setback distance shall in no case be less than fifteen feet.'
      quote: Determinations of the appropriate setback distance from the fault shall be made using data
        obtained in the geological report by the person or firm who prepared the geological report, but
        in no case shall this distance be less than fifteen feet.
      document: 'Fruit Heights City Code Chapter 10.10A: Sensitive Lands Evaluation & Development Standards
        (SLEDS)'
      file: fh-1592.pdf
      url: https://www.fruitheights.gov/DocumentCenter/View/1592
      section: 10.10A.040 Development standards and controls
      pages:
      - 9
      - 15
    active_fault_definition:
      specified: true
      value: An active fault is one displaying evidence of displacement along one or more of its traces
        during Holocene time, approximately 10,000 years ago to the present. Quaternary faults within
        the Surface Fault Rupture Hazard Study Area are considered active until proven otherwise. Any
        fault displacing late-stage Bonneville Lake Cycle deposits is considered active unless those deposits
        are overlain by clearly unfaulted early Holocene-age deposits.
      quote: “Active fault” means a fault displaying evidence of displacement along one or more of its
        traces during Holocene time, which is approximately 10,000 years ago to the present.
      document: 'Fruit Heights City Code Chapter 10.10A: Sensitive Lands Evaluation & Development Standards
        (SLEDS)'
      file: fh-1592.pdf
      url: https://www.fruitheights.gov/DocumentCenter/View/1592
      section: 10.10A.030 Definitions
      pages:
      - 6
      - 9
    slope_fs_static:
      specified: true
      value: The minimum acceptable static factor of safety is 1.5 for both gross and surficial slope
        stability. For surficial stability, this assumes a fully saturated 4-foot thickness.
      quote: The minimum acceptable static factor of safety is 1.5 for both gross and surficial slope
        stability.
      document: 'Fruit Heights City SLEDS (Chapter 10.10A) Appendices: Minimum Standards for Hazard Studies'
      file: fruit-heights-sleds-app-b.pdf
      url: https://www.fruitheights.gov/DocumentCenter/View/1591
      section: Appendix C - Slope Stability > 4.0 FACTORS OF SAFETY
      pages:
      - 17
      - 17
    slope_fs_seismic:
      specified: true
      value: The minimum acceptable factor of safety for a calibrated pseudostatic analysis is 1.0 using
        the method of Stewart et al. (2003). If it is not met, an analysis of permanent seismic slope
        deformation shall be performed. Calculated seismic displacements shall be 15 cm or less, or mitigation
        shall be proposed to limit them to 15 cm or less; Bray and Travasarou (2007) is the city's preferred
        method.
      quote: For this procedure, a factor of safety of 1.0 or greater is considered acceptable; otherwise,
        an analysis of permanent seismic slope deformation shall be performed.
      document: 'Fruit Heights City SLEDS (Chapter 10.10A) Appendices: Minimum Standards for Hazard Studies'
      file: fruit-heights-sleds-app-b.pdf
      url: https://www.fruitheights.gov/DocumentCenter/View/1591
      section: Appendix C - Slope Stability > 12.0 SEISMIC SLOPE STABILITY > 12.2 Pseudo-Static Evaluations
      pages:
      - 23
      - 23
    slope_fs_temporary:
      specified: true
      value: The temporary stability of excavations shall be evaluated, and mitigation shall be recommended
        as necessary to obtain a minimum factor of safety of 1.3.
      quote: (c) The temporary stability of excavations shall be evaluated and mitigation measures shall
        be recommended as necessary to obtain a minimum factor of safety of 1.3.
      document: 'Fruit Heights City SLEDS (Chapter 10.10A) Appendices: Minimum Standards for Hazard Studies'
      file: fruit-heights-sleds-app-b.pdf
      url: https://www.fruitheights.gov/DocumentCenter/View/1591
      section: Appendix C - Slope Stability > 10.0 GROSS STATIC STABILITY
      pages:
      - 20
      - 21
    seismic_coefficient:
      specified: true
      value: Using the Blake et al. (2002) screening analysis, kh is selected from seismic source characteristics
        (modal magnitude, modal distance, and firm rock peak ground acceleration) together with a specified
        acceptable level of deformation. Design ground motion is based on peak accelerations with a 2.0
        percent probability in 50 years (2,500-year return period) from the USGS National Seismic Hazard
        Maps. These are adjusted for site class per Seed et al. (2001), or site-specific response analysis
        may be used.
      quote: For that procedure a kh-value is selected from seismic source characteristics (modal magnitude,
        modal distance, and firm rock peak ground acceleration) and an acceptable level of deformation
        is specified.
      document: 'Fruit Heights City SLEDS (Chapter 10.10A) Appendices: Minimum Standards for Hazard Studies'
      file: fruit-heights-sleds-app-b.pdf
      url: https://www.fruitheights.gov/DocumentCenter/View/1591
      section: Appendix C - Slope Stability > 12.0 SEISMIC SLOPE STABILITY > 12.2 Pseudo-Static Evaluations
      pages:
      - 23
      - 23
    report_validity:
      specified: false
      value: The text sets report content, review, signature and certification requirements, but it does
        not state how long a geotechnical or geologic-hazards report remains valid or what must be submitted
        after any such period.
  ogden_valley:
    fault_setback_method:
      specified: false
      value: The text sets a fixed minimum setback of 50 feet from an active fault trace and allows a
        reduction if a report justifies it, but it names no formula or method for calculating the setback
        and nothing to compare it with.
    fault_setback_minimum:
      specified: true
      value: Building setbacks shall be a minimum of 50 feet from an active fault trace. A reduction may
        be considered if the report presents evidence justifying it that is acceptable to the land use
        authority, after recommendation from the city engineer.
      quote: Building setbacks shall be a minimum of 50 feet from an active fault trace.
      document: 'Ogden Valley Code Chapter 108-22: Natural Hazard Areas'
      file: ogden-valley-108-22.pdf
      url: https://ogdenvalley.gov/wp-content/uploads/2026/05/Chapter-108-22-Natural-Hazard-Areas.pdf
      section: Sec 108-22-2 Potential Hazards
      pages:
      - 1
      - 6
    active_fault_definition:
      specified: false
      value: The text uses the term 'active fault' and prohibits building astride one, but it gives no
        age or time criterion defining an active fault.
    slope_fs_static:
      specified: false
      value: The text requires slope stability analysis under static conditions in landslide areas, but
        it states no minimum factor of safety.
    slope_fs_seismic:
      specified: false
      value: The text requires slope stability analysis to include earthquake-induced conditions, but
        it states no seismic factor of safety and no requirement for when one is not met.
    slope_fs_temporary:
      specified: false
      value: The text does not address factors of safety for temporary slopes or excavations during construction.
    seismic_coefficient:
      specified: false
      value: The text does not specify how a horizontal seismic coefficient is selected or what design
        ground motion level it is based on; it only mentions critical accelerations for liquefaction evaluation.
    report_validity:
      specified: false
      value: The text does not state how long a geotechnical or geologic-hazards report remains valid
        or what must be submitted after it expires.
