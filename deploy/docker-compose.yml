# The whole application. On the server the rag-api container uses the instance role.
# Local run (adds your shell's AWS credentials):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml --env-file deploy/.env up -d --build
name: geo-rag

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 10s
      timeout: 5s
      retries: 10

  rag-api:
    image: ${RAG_API_IMAGE:-geo-rag-api:local}
    build:
      context: ..
      dockerfile: services/rag-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD}@postgres:5432/rag
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      AWS_REGION: ${AWS_REGION:-us-west-2}
      DAILY_TOKEN_LIMIT: ${DAILY_TOKEN_LIMIT:-3000000}
    networks:
      default:
        ipv4_address: 172.28.0.10     # fixed, so the server firewall can allow only this container to reach AWS credentials

  open-webui:
    image: ${WEBUI_IMAGE:-geo-rag-webui:local}
    build:
      context: ../services/openwebui
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - rag-api
    environment:
      WEBUI_NAME: ${WEBUI_NAME:-Stratum}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY}
      # Settings always come from this file, never from values saved in the database on an earlier run.
      ENABLE_PERSISTENT_CONFIG: "false"
      WEBUI_URL: ${WEBUI_URL:-http://localhost:3000}
      RAG_API_URL: http://rag-api:8000
      RAG_API_KEY: ${INTERNAL_API_KEY}
      ENABLE_FABLE: ${ENABLE_FABLE:-false}
      # Accounts: nobody can self-register. The first account (admin) is created by the bootstrap script.
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: "true"
      DEFAULT_USER_ROLE: user
      ENABLE_API_KEYS: "false"
      BYPASS_MODEL_ACCESS_CONTROL: "true"
      # The only models are the ones our Pipe function exposes.
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "false"
      ENABLE_DIRECT_CONNECTIONS: "false"
      DEFAULT_MODELS: jurisdiction_rag.scoped-opus
      # Turn off features that are not part of this demo (and would spend tokens or memory).
      RAG_EMBEDDING_ENGINE: openai
      BYPASS_EMBEDDING_AND_RETRIEVAL: "true"
      ENABLE_WEB_SEARCH: "false"
      ENABLE_IMAGE_GENERATION: "false"
      ENABLE_CODE_EXECUTION: "false"
      ENABLE_CODE_INTERPRETER: "false"
      ENABLE_MEMORIES: "false"
      ENABLE_NOTES: "false"
      ENABLE_CHANNELS: "false"
      ENABLE_CALENDAR: "false"
      USER_PERMISSIONS_FEATURES_CALENDAR: "false"
      ENABLE_USER_STATUS: "false"
      ENABLE_PUBLIC_ACTIVE_USERS_COUNT: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_SEARCH_QUERY_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      ENABLE_VERSION_UPDATE_CHECK: "false"
      SHOW_ADMIN_DETAILS: "false"
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
      WEBUI_BANNERS: >-
        [{"id":"demo-notice","type":"info","title":"","content":"The sample project is fictional; the regulations are real, downloaded 2026-11-24. Not engineering advice: confirm against the currently adopted code.","dismissible":true,"timestamp":1795564800}]
      DEFAULT_PROMPT_SUGGESTIONS: >-
        [{"title":["Compare all three sites","minimum slope stability factors of safety"],"content":"What minimum factors of safety apply to slope stability at each site, static and seismic? Show the differences."},
         {"title":["Fault setbacks","how is the setback determined at each site?"],"content":"For each site, how is the required fault setback determined? Name the method each jurisdiction adopted and any minimum distance."},
         {"title":["Site A only","how long is our geotechnical report valid?"],"content":"For Site A, how long is a geotechnical report valid, and what do we have to submit after that?"},
         {"title":["Draft a report section","regulatory requirements for Site B"],"content":"Draft the 'Regulatory Requirements' section of the geologic hazards report for Site B. Cover fault investigation, slope stability and liquefaction, with the governing criteria."},
         {"title":["Definitions that differ","what counts as an active fault?"],"content":"How does each jurisdiction in this project define an active fault? Does the definition change which faults we must set back from?"}]
    volumes:
      - openwebui:/app/backend/data
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]            # started on the server only
    restart: unless-stopped
    depends_on:
      - open-webui
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  openwebui:
  caddy_data:
  caddy_config:
