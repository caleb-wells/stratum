# The whole application. On the server the rag-api container uses the instance role.
# Local run (adds your shell's AWS credentials):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml --env-file deploy/.env up -d --build
name: geo-rag

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 10s
      timeout: 5s
      retries: 10

  rag-api:
    image: ${RAG_API_IMAGE:-geo-rag-api:local}
    build:
      context: ..
      dockerfile: services/rag-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD}@postgres:5432/rag
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      AWS_REGION: ${AWS_REGION:-us-west-2}
      DAILY_TOKEN_LIMIT: ${DAILY_TOKEN_LIMIT:-3000000}

  chat:
    image: ${CHAT_IMAGE:-stratum-chat:local}
    build:
      context: ..
      dockerfile: services/chat/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rag-api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD}@postgres:5432/chainlit
      CHAINLIT_AUTH_SECRET: ${CHAT_AUTH_SECRET:?set CHAT_AUTH_SECRET}
      CHAINLIT_URL: ${SITE_URL:-http://localhost:3000}
      RAG_API_URL: http://rag-api:8000
      RAG_API_KEY: ${INTERNAL_API_KEY}
      ENABLE_FABLE: ${ENABLE_FABLE:-false}
      # Accounts. There is no self-registration; these are the only two logins.
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_NAME: ${DEMO_NAME:-Guest}
    ports:
      - "127.0.0.1:${CHAT_PORT:-3000}:8080"

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]            # started on the server only
    restart: unless-stopped
    depends_on:
      - chat
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
