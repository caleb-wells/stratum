[project]
user_env = []
session_timeout = 3600
user_session_timeout = 1296000
cache = false
allow_origins = ["*"]

[features]
unsafe_allow_html = false
latex = false
user_message_markdown = true
user_message_autoscroll = true
assistant_message_autoscroll = true
auto_tag_thread = true
edit_message = true
allow_thread_sharing = false
favorites = false

[features.spontaneous_file_upload]
    enabled = false

[features.audio]
    enabled = false

[features.mcp]
    enabled = false

[UI]
name = "Stratum"
description = "Geotechnical requirements for multi-jurisdiction projects, kept separate by jurisdiction and tied to their sources."
default_theme = "dark"
layout = "wide"
default_sidebar_state = "open"
confirm_new_chat = false
cot = "full"
custom_css = "/public/stratum.css?v=3"
custom_js = "/public/stratum.js"
alert_style = "modern"
login_page_image = "/public/login.svg"
login_page_image_filter = ""
login_page_image_dark_filter = ""

