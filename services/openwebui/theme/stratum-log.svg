<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2400" viewBox="0 0 360 2400">
  <!-- A stylised boring log: soil layers with their standard hatch styles, a depth scale, and USCS group symbols. -->
  <defs>
    <pattern id="topsoil" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#3a2e26"/>
      <path d="M2 11 l3 -6 M8 12 l3 -7" stroke="#57463a" stroke-width="1.2" stroke-linecap="round"/>
    </pattern>
    <pattern id="clay" width="26" height="12" patternUnits="userSpaceOnUse">
      <rect width="26" height="12" fill="#7b4f37"/>
      <path d="M2 3 h14 M12 9 h12" stroke="#5c3826" stroke-width="1.4" stroke-linecap="round"/>
    </pattern>
    <pattern id="sand" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#c3a268"/>
      <circle cx="3" cy="3" r="1" fill="#93783f"/><circle cx="9" cy="8" r="1" fill="#93783f"/>
    </pattern>
    <pattern id="silt" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#7d8572"/>
      <path d="M0 16 L16 0" stroke="#646c5a" stroke-width="1.2"/><circle cx="4" cy="4" r=".9" fill="#5c6452"/>
    </pattern>
    <pattern id="gravel" width="30" height="26" patternUnits="userSpaceOnUse">
      <rect width="30" height="26" fill="#5c626a"/>
      <ellipse cx="8" cy="8" rx="5" ry="3.6" fill="none" stroke="#8b929b" stroke-width="1.2"/>
      <ellipse cx="22" cy="18" rx="4.4" ry="3.2" fill="none" stroke="#8b929b" stroke-width="1.2"/>
      <circle cx="21" cy="6" r="1.6" fill="#8b929b"/>
    </pattern>
    <pattern id="rock" width="44" height="22" patternUnits="userSpaceOnUse">
      <rect width="44" height="22" fill="#2a2f36"/>
      <path d="M0 0 h44 M0 11 h44 M11 0 v11 M33 11 v11" stroke="#3d444e" stroke-width="1.3"/>
    </pattern>
  </defs>

  <!-- painted bottom-up so each layer overlaps the one beneath and no gaps show -->
  <rect x="0" y="0" width="300" height="2400" fill="url(#rock)"/>
  <path d="M0 0 H300 V1130 C230 1146 120 1118 0 1136 Z" fill="url(#gravel)"/>
  <path d="M0 0 H300 V880 C250 870 160 894 90 880 S20 872 0 884 Z" fill="url(#silt)"/>
  <path d="M0 0 H300 V640 C220 654 140 628 60 644 L0 640 Z" fill="url(#sand)"/>
  <path d="M0 0 H300 V430 C240 420 170 446 100 432 S30 424 0 436 Z" fill="url(#clay)"/>
  <path d="M0 0 H300 V150 C230 162 150 138 80 152 S20 160 0 150 Z" fill="url(#topsoil)"/>

  <!-- depth scale -->
  <rect x="300" y="0" width="60" height="2400" fill="#15181b"/>
  <path d="M300 0 V2400" stroke="#4a5058" stroke-width="1"/>
  <g stroke="#6f757d" stroke-width="1">
    <path d="M300 60h8M300 120h8M300 180h8M300 300h8M300 360h8M300 420h8M300 540h8M300 600h8M300 660h8M300 780h8M300 840h8M300 900h8M300 1020h8M300 1080h8M300 1140h8M300 1260h8M300 1320h8M300 1380h8M300 1500h8M300 1560h8M300 1620h8"/>
    <path d="M300 240h16M300 480h16M300 720h16M300 960h16M300 1200h16M300 1440h16M300 1680h16" stroke="#a9a59b"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#a9a59b">
    <text x="322" y="18">ft</text>
    <text x="322" y="244">10</text><text x="322" y="484">20</text><text x="322" y="724">30</text>
    <text x="322" y="964">40</text><text x="322" y="1204">50</text><text x="322" y="1444">60</text><text x="322" y="1684">70</text>
  </g>

  <!-- USCS group symbols, as written beside each layer on a field log -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">
    <g fill="#15181b" opacity=".82">
      <rect x="246" y="276" width="40" height="24" rx="3"/><rect x="246" y="522" width="40" height="24" rx="3"/>
      <rect x="246" y="748" width="40" height="24" rx="3"/><rect x="246" y="994" width="40" height="24" rx="3"/>
    </g>
    <g fill="#ece7dd" text-anchor="middle">
      <text x="266" y="293">CL</text><text x="266" y="539">SP</text><text x="266" y="765">ML</text><text x="266" y="1011">GP</text>
    </g>
  </g>
</svg>
